name: Release

on:
  push:
    branches: [release]
    tags: ['v*']

jobs:
  auto-tag:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next RC tag
        id: rc
        run: |
          BASE_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")

          LATEST_RC=$(git tag -l "v${BASE_VERSION}-rc.*" \
            | sort -t. -k1,1V -k2,2n -k3,3n \
            | tail -1)

          if [ -z "$LATEST_RC" ]; then
            NEXT_RC=1
          else
            CURRENT=$(echo "$LATEST_RC" | grep -oP 'rc\.\K\d+')
            NEXT_RC=$((CURRENT + 1))
          fi

          TAG="v${BASE_VERSION}-rc.${NEXT_RC}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Push RC tag
        run: |
          git tag "${{ steps.rc.outputs.tag }}"
          git push origin "${{ steps.rc.outputs.tag }}"

  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries
        run: cargo build --release
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            target/release/keystats-daemon
            target/release/keystatsctl

  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Build extension zip
        run: make zip
      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: gnome-extension/keystats@0x5c0f.github.io.zip

  publish:
    needs: [auto-tag, build-binaries, build-extension]
    if: always() && needs.build-binaries.result == 'success' && needs.build-extension.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag and prerelease
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ needs.auto-tag.outputs.tag }}"
          fi

          if echo "$TAG" | grep -qE 'rc\.[0-9]+$'; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          DIST_NAME="keystats-${TAG#v}-linux-x86_64"
          mkdir -p "${DIST_NAME}/bin" "${DIST_NAME}/systemd" "${DIST_NAME}/udev"
          cp artifacts/binaries/keystats-daemon "${DIST_NAME}/bin/"
          cp artifacts/binaries/keystatsctl "${DIST_NAME}/bin/"
          cp packaging/systemd/keystats.service "${DIST_NAME}/systemd/"
          cp packaging/udev/60-keystats-input.rules "${DIST_NAME}/udev/"
          cp packaging/dist/Makefile "${DIST_NAME}/"
          cp packaging/dist/README.md "${DIST_NAME}/"
          cp packaging/dist/README.zh-CN.md "${DIST_NAME}/"
          tar -czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"
          echo "DIST_ASSET=${DIST_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: KeyStats ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ env.DIST_ASSET }}
            artifacts/extension/keystats@0x5c0f.github.io.zip

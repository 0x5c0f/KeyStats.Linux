[workspace]
resolver = "3"
members = [
    "crates/keystats-core",
    "crates/keystats-daemon",
    "crates/keystatsctl",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/0x5c0f/KeyStats.Linux"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
